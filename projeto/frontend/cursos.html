<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cursos — SESI Indústria</title>
  <meta name="description" content="Pesquise e filtre os cursos disponíveis no ambiente virtual de aprendizagem.">
  <!-- <meta name="api-base" content="https://sua-api.onrender.com/api"> -->
  <!-- <meta name="moodle-url" content="https://seu-moodle"> -->
  <link rel="icon" href="assets/icons/logo-sesi.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
  <header class="header" data-layout="header"></header>

  <main id="conteudo">
    <div class="container pagina-titulo">
      <h1>Catálogo de cursos</h1>
      <p>Pesquise pelo nome e combine filtros de categoria, modalidade e status para encontrar a formação certa.</p>
    </div>

    <section class="filtros" aria-labelledby="filtros-titulo">
      <div class="container">
        <h2 id="filtros-titulo" class="sr-only">Pesquisar e filtrar cursos</h2>
        <form class="filtros__form" id="form-filtros" role="search">
          <div class="campo campo--busca">
            <label for="busca">Pesquisar pelo nome</label>
            <input type="search" id="busca" name="busca" placeholder="Ex.: matemática, comunicação…" autocomplete="off">
            <svg class="campo__icone" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M16.6 17.5 11 11.9a5.3 5.3 0 0 1-1.6.9 5.9 5.9 0 0 1-1.9.3 5.4 5.4 0 0 1-4-1.6A5.4 5.4 0 0 1 2 7.6c0-1.6.5-2.9 1.6-4A5.4 5.4 0 0 1 7.5 2c1.6 0 2.9.5 4 1.6a5.4 5.4 0 0 1 1.6 4c0 .7-.1 1.3-.3 1.9a5.3 5.3 0 0 1-.9 1.6l5.6 5.6-.9.8ZM7.5 11.8c1.2 0 2.2-.4 3-1.2a4 4 0 0 0 1.2-3c0-1.2-.4-2.2-1.2-3a4 4 0 0 0-3-1.2c-1.2 0-2.2.4-3 1.2a4 4 0 0 0-1.2 3c0 1.2.4 2.2 1.2 3a4 4 0 0 0 3 1.2Z"/></svg>
          </div>
          <div class="campo"><label for="modalidade">Modalidade</label><select id="modalidade" name="modalidade"><option value="">Todas</option></select></div>
          <div class="campo"><label for="status">Status</label><select id="status" name="status"><option value="">Todos</option></select></div>
          <div class="campo">
            <label for="ordenar">Ordenar por</label>
            <select id="ordenar" name="ordenar">
              <option value="">Nome (A–Z)</option>
              <option value="nome-desc">Nome (Z–A)</option>
              <option value="data">Data de disponibilização</option>
              <option value="carga">Menor carga horária</option>
              <option value="carga-desc">Maior carga horária</option>
            </select>
          </div>
          <button type="submit" class="sr-only">Pesquisar</button>
        </form>
        <div class="categorias" id="categorias" role="group" aria-label="Filtrar por categoria"></div>
      </div>
    </section>

    <section class="container" aria-labelledby="resultados-titulo">
      <div class="resultados-bar">
        <h2 id="resultados-titulo" class="sr-only">Resultados</h2>
        <p class="resultados-bar__qtd" id="qtd-resultados" aria-hidden="true">Carregando cursos…</p>
        <p class="sr-only" id="live" aria-live="polite"></p>
        <button type="button" class="btn btn--link" id="limpar" hidden>Limpar filtros</button>
      </div>
      <div class="grid" id="grid" aria-busy="true"></div>
      <nav class="paginacao" id="paginacao" aria-label="Paginação" hidden>
        <button type="button" class="btn btn--outline" id="pag-anterior">Anterior</button>
        <span id="pag-info"></span>
        <button type="button" class="btn btn--outline" id="pag-proxima">Próxima</button>
      </nav>
    </section>
  </main>

  <footer class="footer" data-layout="footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/catalogo.js"></script>
</body>
</html>
