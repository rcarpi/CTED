server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy da API: o front chama /api/... e o nginx encaminha para o container da API.
    # Assim o browser usa a mesma origem (sem CORS) tanto local quanto em produção.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(png|jpg|svg|ttf|css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
